name: scheduled-scan

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Harvest listings from GitHub IP and import to the live app
        env:
          APP_URL: ${{ secrets.APP_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        run: node scripts/harvest.js
